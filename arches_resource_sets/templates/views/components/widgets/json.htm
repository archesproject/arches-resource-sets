{% extends "views/components/widgets/base.htm" %}
{% load i18n %}

{% block form %}
<div class="row widget-wrapper">
    <div class="form-group">
        <label class="control-label widget-input-label" data-bind="text: label"></label>
        <!-- ko if: node -->
        <i data-bind="
            css: {'ion-asterisk widget-label-required': node.isrequired},
            attr: {'aria-label': $root.translations.required}
        "></i>
        <!-- /ko -->

        <div class="col-xs-12">
            <textarea
                class="form-control input-lg widget-input"
                data-bind="
                    textInput: textValue,
                    attr: {
                        placeholder: placeholder,
                        rows: rows,
                        'aria-label': label
                    }
                "
            ></textarea>
        </div>

        <!-- ko if: parseError -->
        <div class="col-xs-12" style="padding-top: 8px; color: #a94442;" data-bind="text: parseError"></div>
        <!-- /ko -->
    </div>
</div>
{% endblock form %}

{% block config_form %}
<div class="control-label">
    <span data-bind="text: $root.translations.placeholder"></span>
</div>
<div class="col-xs-12 pad-no crud-widget-container">
    <input
        class="form-control input-md widget-input"
        data-bind="
            attr: {placeholder: $root.translations.placeholder, 'aria-label': $root.translations.placeholder},
            textInput: placeholder
        "
    >
</div>

<div class="control-label">
    <span data-bind="text: $root.translations.defaultValue"></span>
</div>
<div class="col-xs-12 pad-no crud-widget-container">
    <textarea
        class="form-control input-md widget-input"
        data-bind="
            textInput: defaultValueText,
            attr: {
                placeholder: $root.translations.defaultValue,
                rows: rows,
                'aria-label': $root.translations.defaultValue
            }
        "
    ></textarea>
</div>
<!-- ko if: defaultValueParseError -->
<div class="col-xs-12" style="padding-top: 8px; color: #a94442;" data-bind="text: defaultValueParseError"></div>
<!-- /ko -->
{% endblock config_form %}
